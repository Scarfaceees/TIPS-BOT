services:
  tipsbot:
    build:
      context: .
      args:
        # Phase 3.5.2 / F2: commit buildu nastavuje scripts/build_release.py (overi cisty strom). Bez nej selze build
        # v Dockerfile; ostatni prikazy (up, ps, logs, rollback) promennou nepotrebuji.
        TIPSBOT_CODE_REV: ${TIPSBOT_CODE_REV:-}
    image: tipsbot-local
    container_name: tipsbot
    restart: always
    ports:
      - "8000:8000"   # i z telefonu v domaci siti: http://<IP tohoto pocitace>:8000 (panel nema heslo, jen domaci sit)
    volumes:
      - ./data:/app/data
    environment:
      TZ: Europe/Prague

  # automat: kazdych 6 h data, kurzy na 48 h dopredu, vsechny profily, vyhodnoceni
  tipsbot-auto:
    build:
      context: .
      args:
        TIPSBOT_CODE_REV: ${TIPSBOT_CODE_REV:-}
    image: tipsbot-local
    container_name: tipsbot-auto
    restart: always
    command: ["tipsbot", "auto"]
    volumes:
      - ./data:/app/data
    environment:
      TZ: Europe/Prague
