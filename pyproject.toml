[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tipsbot"
version = "0.1.0"
description = "Value-betting poradce pro NHL a evropsky fotbal (bez automatickeho podani sazky)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "SQLAlchemy", "requests", "flask", "tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tipsbot = "tipsbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
